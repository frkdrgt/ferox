[package]
name = "ferox-pg"
version = "0.3.1"
edition = "2024"
description = "Blazing-fast lightweight PostgreSQL client built in Rust"
authors = ["frkdrgt"]
license = "MIT"
repository = "https://github.com/frkdrgt/ferox"
homepage = "https://github.com/frkdrgt/ferox"
keywords = ["postgresql", "postgres", "database", "client", "gui"]
categories = ["database", "gui"]

[[bin]]
name = "ferox"
path = "src/main.rs"

[dependencies]
# GUI — accesskit (screen-reader support) disabled to save RAM
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.29", default-features = false }
# Phosphor icon names (regular). The font itself is a ~19 KB subset in
# assets/phosphor-subset.ttf (scripts/subset_icons.py) — one consistent line-icon set
# for toolbar, tree, tabs and cards instead of mixed Unicode symbols.
egui-phosphor = { version = "0.7", default-features = false, features = ["regular"] }

# PostgreSQL — type-conversion features not needed (simple_query returns plain strings)
tokio-postgres = { version = "0.7" }
native-tls = "0.2"
postgres-native-tls = "0.5"

# Async runtime — rt-multi-thread not needed; DB worker uses its own current_thread rt
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
# Already resolved transitively via tokio-postgres — pinned as direct deps only
# for CSV import's COPY-in streaming (SinkExt / Bytes); no new binary weight.
futures-util = "0.3"
bytes = "1"

# Config / serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"



# Native file dialog
rfd = "0.14"

# SSH tunnel
russh = "0.44"
russh-keys = "0.44"
async-trait = "0.1"

# Icon loading
image = { version = "0.24", default-features = false, features = ["png"] }

# HTTP client for Claude AI API
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
hex = "0.4"
sqlformat = "0.2"

# OS keychain (Credential Manager / Keychain / Secret Service) for connection
# passwords & API keys — rides on security-framework (already linked via native-tls)
# and zbus (already linked via rfd→ashpd on Linux), so marginal cost is low.
keyring = "4"

# Decrypting DBeaver's credentials-config.json (AES-128-CBC) for connection
# import — both already linked via russh at these versions, no new binary weight.
aes = "0.8"
cbc = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[dev-dependencies]
tokio-test = "0.4"
# Already in the tree via egui — reads the icon subset in theme::tests
ab_glyph = "0.2"

# Build deps — icon generation
[build-dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
ico = "0.3"

# Windows-only build deps (manifest + icon embedding)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
